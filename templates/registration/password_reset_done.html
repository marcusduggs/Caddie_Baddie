{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center py-12 px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md text-center">
    <div class="text-5xl mb-4">📬</div>
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Check your inbox</h2>
    <p class="text-gray-500 text-sm leading-relaxed mb-6">
      If an account exists for that email, we've sent a password reset link. It expires in 24 hours.
    </p>
    <a href="{% url 'login' %}"
       class="inline-block bg-indigo-600 text-white font-bold px-6 py-2.5 rounded-lg shadow hover:bg-indigo-700 transition text-sm">
      Back to Log In
    </a>
  </div>
</div>
{% endblock %}
