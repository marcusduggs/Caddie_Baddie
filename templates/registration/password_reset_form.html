{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center py-12 px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🔑</div>
      <h2 class="text-2xl font-bold text-gray-900">Reset your password</h2>
      <p class="text-sm text-gray-500 mt-1">Enter your email and we'll send you a reset link.</p>
    </div>
    <form method="post" class="space-y-5">
      {% csrf_token %}
      <div>
        <label for="id_email" class="block text-sm font-semibold text-gray-700 mb-1">Email address</label>
        <input type="email" name="email" id="id_email" required autofocus
               class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg shadow hover:bg-indigo-700 transition">
        Send reset link
      </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-500">
      <a href="{% url 'login' %}" class="text-indigo-600 font-semibold hover:underline">Back to Log In</a>
    </p>
  </div>
</div>
{% endblock %}
