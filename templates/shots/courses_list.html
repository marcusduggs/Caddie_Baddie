{% extends 'base.html' %}

{% block content %}
  <div class="max-w-7xl mx-auto p-4">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-semibold">My Courses</h2>
  <a href="{% url 'shots:analyze_upload' %}" class="inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Add Course</a>
    </div>

    {% if courses %}
      <div class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
        {% for c in courses %}
          <div class="bg-white rounded-lg shadow p-4">
            <h3 class="text-lg font-medium">{{ c.name }}</h3>
            <p class="text-sm text-gray-500">{{ c.count }} shots</p>
            <div class="mt-3 flex items-center gap-4">
              <a href="{% url 'shots:course_holes' c.slug %}" class="text-sm text-blue-600 hover:underline">View holes</a>
              <a href="{% url 'shots:rounds_list_for_course' c.slug %}" class="text-sm text-gray-600 hover:underline">View rounds</a>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p>No courses found. Upload a shot and set a course name when uploading.</p>
    {% endif %}
  </div>
{% endblock %}
