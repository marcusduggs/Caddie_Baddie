{% extends 'base.html' %}

{% block content %}
  <div class="max-w-2xl mx-auto p-4">
    <h2 class="text-2xl font-semibold mb-4">Add Course</h2>
    {% if error %}
      <div class="mb-4 p-3 bg-red-100 text-red-800 rounded">{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label class="block text-sm font-medium text-gray-700">Course name</label>
      <div class="relative">
        <input type="text" id="id_course_input" name="name" class="block w-full mt-2 p-2 border border-gray-300 rounded" placeholder="e.g. Monarch Bay GC" autofocus autocomplete="off" />
        <input type="hidden" name="suggested_course_id" id="id_suggested_course_id" value="" />
  <input type="hidden" name="verified_course" id="id_verified_course" value="" />
        <div id="course-suggestions" class="mt-1 relative"></div>
      </div>
      <div class="mt-4">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Add Course</button>
        <a href="{% url 'shots:courses_list' %}" class="ml-4 text-sm text-gray-600">Back</a>
      </div>
    </form>
  </div>
  <script>
    // Course name autocomplete (reused from analyze_form)
    (function() {
      const input = document.getElementById('id_course_input');
      const suggestionsContainer = document.getElementById('course-suggestions');
      const hiddenId = document.getElementById('id_suggested_course_id');

      function debounce(fn, wait) {
        let t = null;
        return function(...args) {
          clearTimeout(t);
          t = setTimeout(() => fn.apply(this, args), wait);
        };
      }

      function clearSuggestions() {
        suggestionsContainer.innerHTML = '';
      }

      function renderSuggestions(list) {
        clearSuggestions();
        if (!list || !list.length) return;

        const ul = document.createElement('ul');
        ul.className = 'absolute z-50 left-0 right-0 bg-white border border-gray-200 rounded-md mt-1 max-h-60 overflow-auto shadow-lg';

        list.forEach(item => {
          const li = document.createElement('li');
          li.className = 'px-3 py-2 hover:bg-gray-100 cursor-pointer flex justify-between items-center';
          li.innerHTML = `<span class="truncate">${escapeHtml(item.name)}</span> <span class="text-xs text-gray-500 ml-3">${item.score}%</span>`;
          li.addEventListener('click', () => onSelectSuggestion(item));
          ul.appendChild(li);
        });

        suggestionsContainer.appendChild(ul);
      }

      function escapeHtml(s) {
        return (s || '').replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]; });
      }

      function onSelectSuggestion(item) {
        const score = Number(item.score || 0);
        if (score >= 70 && score < 95) {
          showConfirmModal(item.name, () => applySuggestion(item));
        } else {
          applySuggestion(item);
        }
      }

      function applySuggestion(item) {
        input.value = item.name;
        hiddenId.value = item.id || '';
        clearSuggestions();
      }

      async function fetchSuggestions(q) {
        try {
          const url = new URL(window.location.origin + '{% url "shots:api_course_suggestions" %}');
          url.searchParams.set('q', q);
          const res = await fetch(url.toString(), { method: 'GET' });
          if (!res.ok) return [];
          const payload = await res.json();
          return payload.suggestions || [];
        } catch (e) {
          return [];
        }
      }

      const debounced = debounce(async function(ev) {
        const q = input.value && input.value.trim();
        if (!q || q.length < 2) { clearSuggestions(); return; }
        const suggestions = await fetchSuggestions(q);
        renderSuggestions(suggestions);
      }, 280);

      input.addEventListener('input', debounced);
      document.addEventListener('click', function(ev) {
        if (!suggestionsContainer.contains(ev.target) && ev.target !== input) {
          clearSuggestions();
        }
      });

      // Confirm modal (lighter version)
      function showConfirmModal(suggestedText, onConfirm) {
        let modal = document.getElementById('course-confirm-modal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'course-confirm-modal';
          modal.innerHTML = `
            <div class="fixed inset-0 z-60 flex items-center justify-center bg-black bg-opacity-40">
              <div class="bg-white rounded-lg shadow-lg w-11/12 max-w-lg p-6">
                <h3 class="text-lg font-semibold mb-2">Did you mean this course?</h3>
                <p id="course-confirm-text" class="text-sm text-gray-700 mb-4"></p>
                <div class="flex justify-end space-x-3">
                  <button id="course-confirm-keep" class="px-4 py-2 rounded bg-gray-100">Keep typed</button>
                  <button id="course-confirm-use" class="px-4 py-2 rounded bg-green-600 text-white">Use suggestion</button>
                </div>
              </div>
            </div>`;
          document.body.appendChild(modal);

          document.getElementById('course-confirm-keep').addEventListener('click', () => { modal.remove(); });
        }
        document.getElementById('course-confirm-text').textContent = suggestedText;
        const useBtn = document.getElementById('course-confirm-use');
        const handler = () => { onConfirm(); modal.remove(); useBtn.removeEventListener('click', handler); };
        useBtn.addEventListener('click', handler);
      }
    })();
    // Intercept form submission to verify course exists in golf API
    (function() {
      const form = document.querySelector('form');
      const input = document.getElementById('id_course_input');
      const hiddenId = document.getElementById('id_suggested_course_id');
      const verifiedInput = document.getElementById('id_verified_course');

      function showVerifyModal(courseName, onContinue, onRetry) {
        let modal = document.getElementById('course-verify-modal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'course-verify-modal';
          modal.innerHTML = `
            <div class="fixed inset-0 z-60 flex items-center justify-center bg-black bg-opacity-40">
              <div class="bg-white rounded-lg shadow-lg w-11/12 max-w-lg p-6">
                <h3 class="text-lg font-semibold mb-2">Course not found in golf API</h3>
                <p id="course-verify-text" class="text-sm text-gray-700 mb-4">We couldn't find a matching course in the golf API for <strong></strong>. If you continue, course statistics won't be available.</p>
                <div class="flex justify-end space-x-3">
                  <button id="course-verify-retry" class="px-4 py-2 rounded bg-gray-100">Retry</button>
                  <button id="course-verify-continue" class="px-4 py-2 rounded bg-green-600 text-white">Continue anyway</button>
                </div>
              </div>
            </div>`;
          document.body.appendChild(modal);
          document.getElementById('course-verify-retry').addEventListener('click', () => { modal.remove(); if (onRetry) onRetry(); });
        }
        const txt = document.getElementById('course-verify-text');
        if (txt) txt.innerHTML = `We couldn't find a matching course in the golf API for <strong>${escapeHtml(courseName)}</strong>. If you continue, course statistics won't be available.`;
        const cont = document.getElementById('course-verify-continue');
        const handler = () => { modal.remove(); cont.removeEventListener('click', handler); if (onContinue) onContinue(); };
        if (cont) cont.addEventListener('click', handler);
      }

      async function verifyAndSubmit(ev) {
        // Prevent default submission; we'll submit after verification
        ev.preventDefault();
        const q = input.value && input.value.trim();
        if (!q) return alert('Enter a course name');

        // If user already selected a suggestion id, treat as verified
        if (hiddenId && hiddenId.value) {
          if (verifiedInput) verifiedInput.value = 'verified';
          form.submit();
          return;
        }

        // Call suggestions API to see if course exists
        try {
          const url = new URL(window.location.origin + '{% url "shots:api_course_suggestions" %}');
          url.searchParams.set('q', q);
          const res = await fetch(url.toString(), { method: 'GET' });
          if (!res.ok) {
            // Network or server error; warn and allow continue
            if (!confirm('Could not verify course due to network error. Continue anyway? Course statistics will not be available.')) return;
            if (verifiedInput) verifiedInput.value = 'no_stats';
            form.submit();
            return;
          }
          const payload = await res.json();
          const suggestions = payload.suggestions || [];
          // Determine good match: exact name match (case-insensitive) or score >=85
          let good = null;
          for (const s of suggestions) {
            try {
              if ((s.name || '').toLowerCase() === q.toLowerCase()) { good = s; break; }
              if (Number(s.score || 0) >= 85) { good = s; break; }
            } catch (e) {}
          }
          if (good) {
            // Apply suggestion id so server can reference the golf API record
            if (hiddenId) hiddenId.value = good.id || '';
            if (verifiedInput) verifiedInput.value = 'verified';
            form.submit();
            return;
          }
          // No good match — prompt user
          showVerifyModal(q, () => {
            if (verifiedInput) verifiedInput.value = 'no_stats';
            form.submit();
          }, () => {
            // focus back to input for retry
            input.focus();
          });
        } catch (e) {
          if (!confirm('Unexpected error while verifying course. Continue anyway? Course statistics will not be available.')) return;
          if (verifiedInput) verifiedInput.value = 'no_stats';
          form.submit();
        }
      }

      if (form) form.addEventListener('submit', verifyAndSubmit);
    })();
  </script>
{% endblock %}
