{% extends 'base.html' %}

{% block content %}
  <div class="max-w-2xl mx-auto p-4">
    <h2 class="text-2xl font-semibold mb-4">Add Hole to {{ course.name }}</h2>
    <p class="text-sm text-gray-600 mb-4">Round: <strong>{{ round.name }}</strong>{% if round.played_at %} — {{ round.played_at|date:'Y-m-d' }}{% endif %}</p>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="round_id" value="{{ round.pk }}" />
      <label class="block text-sm font-medium text-gray-700">Hole number</label>
      <div class="mt-2">
        <input type="number" name="hole_number" min="1" max="18" class="block w-40 p-2 border rounded" placeholder="9" required />
      </div>
      <div class="mt-4">
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Add Hole</button>
        <a href="{% url 'shots:round_holes' round_pk=round.pk %}" class="ml-4 text-sm text-gray-600">Back</a>
      </div>
    </form>
  </div>
{% endblock %}
