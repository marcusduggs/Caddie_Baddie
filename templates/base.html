<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Caddie Baddie</title>
    <!-- Tailwind CDN for development. For production, compile Tailwind into your static CSS. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
      /* Mobile-specific optimizations */
      @media (max-width: 768px) {
        body {
          font-size: 16px; /* Prevent zoom on input focus in iOS */
        }
        input, select, textarea {
          font-size: 16px; /* Prevent zoom on input focus in iOS */
        }
        video {
          max-width: 100%;
          height: auto;
        }
      }
      /* Improve touch targets for mobile */
      button, a, input[type="submit"] {
        min-height: 44px; /* iOS recommended touch target size */
        min-width: 44px;
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <header class="site-header bg-green-600 text-white shadow-md" style="height: 248px;">
      <div class="container mx-auto px-4 h-full flex items-center justify-between">
        <div class="flex items-center">
          <h1 class="text-6xl font-bold">
            <a href="/" class="text-white no-underline flex items-center gap-4">
              <img src="/static/images/caddie_baddie_logo.PNG" alt="Caddie Baddie Logo" class="h-62 w-62 object-contain" style="height: 248px; width: 248px;" />
              <span>Caddie Baddie</span>
            </a>
          </h1>
        </div>
        <div class="flex items-center gap-3">
          {% if user.is_authenticated %}
            <a href="{% url 'logout' %}" class="bg-[#3a86ff] text-white px-5 py-2 rounded-lg shadow hover:bg-[#264653] transition">Log Out</a>
          {% endif %}
        </div>
      </div>
    </header>
    <main class="container mx-auto px-4 py-6">
      {% block content %}{% endblock %}
    </main>
    <footer class="mt-8 py-4 text-center text-gray-600 text-sm border-t border-gray-200">
      <p>Caddie Baddie • Make every swing share-worthy.</p>
    </footer>
  </body>
</html>
